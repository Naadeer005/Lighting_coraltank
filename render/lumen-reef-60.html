<!doctype html>
<html><head><meta charset="utf-8"><title>Lumen Reef 60</title>
<style>
html,body{margin:0;background:#0b0820;}
svg{display:block}
text{font-family:"DejaVu Sans",Arial,sans-serif}
.serif{font-family:"DejaVu Serif",Georgia,serif}
</style></head>
<body>
<svg id="s" width="1200" height="1600" viewBox="0 0 1200 1600" xmlns="http://www.w3.org/2000/svg">
<defs>
  <radialGradient id="bg" cx="50%" cy="38%" r="75%">
    <stop offset="0" stop-color="#2a1d6b"/><stop offset=".55" stop-color="#140f3c"/><stop offset="1" stop-color="#07051a"/>
  </radialGradient>
  <linearGradient id="title" x1="0" x2="1"><stop offset="0" stop-color="#e07ae6"/><stop offset="1" stop-color="#d9b47a"/></linearGradient>
  <linearGradient id="accent" x1="0" x2="1"><stop offset="0" stop-color="#e07ae6"/><stop offset=".5" stop-color="#e3a0b8"/><stop offset="1" stop-color="#d9b47a"/></linearGradient>
  <linearGradient id="bodyFront" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#4a4d58"/><stop offset=".45" stop-color="#2a2c34"/><stop offset="1" stop-color="#15161b"/>
  </linearGradient>
  <linearGradient id="bodyTop" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#2b2d35"/><stop offset="1" stop-color="#5c606c"/>
  </linearGradient>
  <linearGradient id="sheen" x1="0" x2="1">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".3" stop-color="#fff" stop-opacity=".18"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#bcd2ff" stop-opacity=".55"/><stop offset=".35" stop-color="#6f7dff" stop-opacity=".22"/><stop offset="1" stop-color="#5b3cff" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#2f5bd6"/><stop offset=".45" stop-color="#2637a8"/><stop offset="1" stop-color="#22146a"/>
  </linearGradient>
  <linearGradient id="waterBack" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#3d6cf0" stop-opacity=".9"/><stop offset="1" stop-color="#1b1260"/>
  </linearGradient>
  <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#8c86e8"/><stop offset="1" stop-color="#3b2f8c"/>
  </linearGradient>
  <linearGradient id="glass" x1="0" x2="1">
    <stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".08" stop-color="#fff" stop-opacity=".02"/><stop offset=".9" stop-color="#fff" stop-opacity=".02"/><stop offset="1" stop-color="#fff" stop-opacity=".18"/>
  </linearGradient>
  <linearGradient id="rock" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#6a4fa8"/><stop offset="1" stop-color="#2a1b55"/>
  </linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#1e1946" stop-opacity=".92"/><stop offset="1" stop-color="#120e2e" stop-opacity=".92"/>
  </linearGradient>
  <linearGradient id="spec" x1="0" x2="1">
    <stop offset="0" stop-color="#7b2cff"/><stop offset=".18" stop-color="#5d3bff"/><stop offset=".32" stop-color="#2d5bff"/>
    <stop offset=".45" stop-color="#1fb3ff"/><stop offset=".6" stop-color="#3dff9a"/><stop offset=".75" stop-color="#ffe066"/><stop offset=".88" stop-color="#ff8a3d"/><stop offset="1" stop-color="#ff2d55"/>
  </linearGradient>
  <linearGradient id="dayArc" x1="0" x2="1">
    <stop offset="0" stop-color="#ff9a5c"/><stop offset=".5" stop-color="#ffffff"/><stop offset=".8" stop-color="#ff7aa8"/><stop offset="1" stop-color="#5b6cff"/>
  </linearGradient>
  <linearGradient id="gauge" x1="0" x2="1">
    <stop offset="0" stop-color="#5b6cff"/><stop offset=".5" stop-color="#e07ae6"/><stop offset="1" stop-color="#d9b47a"/>
  </linearGradient>
  <radialGradient id="ledGlow"><stop offset="0" stop-color="#fff"/><stop offset=".35" stop-color="#9fb4ff" stop-opacity=".8"/><stop offset="1" stop-color="#4b3cff" stop-opacity="0"/></radialGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="bigGlow" x="-50%" y="-200%" width="200%" height="500%"><feGaussianBlur stdDeviation="18"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="2"/></filter>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity=".55"/></filter>
  <clipPath id="tankClip"><rect x="170" y="452" width="860" height="560"/></clipPath>
  <clipPath id="phoneClip"><rect x="858" y="1086" width="232" height="456" rx="26"/></clipPath>
</defs>

<rect width="1200" height="1600" fill="url(#bg)"/>

<!-- Heading -->
<text x="70" y="92" class="serif" font-size="46" fill="url(#title)">Lumen Reef 60</text>
<text x="72" y="128" font-size="17" fill="#b9b0dc" letter-spacing="3">SMART LED LIGHT FOR 60 CM REEF TANKS</text>

<!-- dimension line -->
<g stroke="#d9b47a" stroke-width="1.5" fill="none" opacity=".9">
  <path d="M190 172 V196 M1010 172 V196 M190 184 H1010"/>
  <path d="M190 184 l12 -6 v12 z M1010 184 l-12 -6 v12 z" fill="#d9b47a"/>
</g>
<rect x="556" y="170" width="88" height="28" rx="14" fill="#0e0b28"/>
<text x="600" y="190" text-anchor="middle" font-size="17" fill="#f1d9a8" font-weight="bold">60 cm</text>

<!-- Light beams (behind tank front) -->
<g style="mix-blend-mode:screen">
  <polygon points="215,300 985,300 1030,1000 170,1000" fill="url(#beam)" opacity=".75"/>
</g>

<!-- Tank back / water -->
<g id="tank">
  <!-- back panel (perspective) -->
  <polygon points="200,420 1000,420 1030,452 170,452" fill="#3a63e0" opacity=".35"/>
  <rect x="170" y="452" width="860" height="560" fill="url(#water)"/>
  <g clip-path="url(#tankClip)">
    <rect x="170" y="452" width="860" height="560" fill="url(#waterBack)" opacity=".35"/>
    <g id="beams" style="mix-blend-mode:screen"></g>
    <g id="reef"></g>
    <g id="caustics" opacity=".35" style="mix-blend-mode:screen"></g>
  </g>
  <!-- water surface -->
  <polygon points="200,432 1000,432 1030,466 170,466" fill="#8fb0ff" opacity=".35"/>
  <path d="M170 466 H1030" stroke="#cfe0ff" stroke-width="2" opacity=".7"/>
  <!-- glass -->
  <rect x="170" y="420" width="860" height="592" fill="url(#glass)"/>
  <path d="M170 420 V1012 H1030 V420 M170 420 L200 400 H1000 L1030 420 Z" fill="none" stroke="#dfe8ff" stroke-opacity=".55" stroke-width="2"/>
  <path d="M200 400 V430 M1000 400 V430" stroke="#dfe8ff" stroke-opacity=".25" stroke-width="1.5"/>
  <!-- stand -->
  <rect x="150" y="1012" width="900" height="16" rx="3" fill="#1a1630"/>
  <rect x="150" y="1012" width="900" height="3" fill="#d9b47a" opacity=".6"/>
</g>

<!-- Mount arms -->
<g fill="none" stroke-linecap="round">
  <path d="M250 300 C 250 340, 236 370, 236 406" stroke="#2a2c34" stroke-width="10"/>
  <path d="M950 300 C 950 340, 964 370, 964 406" stroke="#2a2c34" stroke-width="10"/>
  <path d="M250 300 C 250 340, 236 370, 236 406" stroke="#8a8f9c" stroke-width="2" opacity=".6"/>
  <path d="M950 300 C 950 340, 964 370, 964 406" stroke="#8a8f9c" stroke-width="2" opacity=".6"/>
</g>
<rect x="222" y="400" width="30" height="20" rx="4" fill="#2a2c34" stroke="#555a66"/>
<rect x="948" y="400" width="30" height="20" rx="4" fill="#2a2c34" stroke="#555a66"/>

<!-- Fixture -->
<ellipse cx="600" cy="312" rx="400" ry="18" fill="#8aa0ff" filter="url(#bigGlow)" opacity=".9"/>
<g filter="url(#shadow)">
  <path d="M232 222 H968 Q990 222 1004 248 L1010 256 H190 L196 248 Q210 222 232 222 Z" fill="url(#bodyTop)"/>
  <rect x="190" y="254" width="820" height="46" rx="14" fill="url(#bodyFront)"/>
</g>
<rect x="190" y="254" width="820" height="46" rx="14" fill="url(#sheen)"/>
<!-- vents -->
<g fill="#16171c" opacity=".9" id="vents"></g>
<!-- accent light strip -->
<rect x="206" y="292" width="788" height="3" rx="1.5" fill="url(#accent)" filter="url(#glow)"/>
<!-- logo + status -->
<text x="600" y="283" text-anchor="middle" font-size="13" letter-spacing="6" fill="#c9cbd6" opacity=".85">LUMEN</text>
<circle cx="975" cy="277" r="4" fill="#7dffb2" filter="url(#glow)"/>
<!-- LED underside glow line -->
<rect x="215" y="299" width="770" height="4" rx="2" fill="#e8eeff" filter="url(#glow)"/>

<!-- PAR depth readouts on tank -->
<g font-size="14" fill="#fff">
  <g id="parTags"></g>
</g>

<!-- Callouts -->
<g font-size="14" fill="#e9e3ff">
  <path d="M1012 278 L1040 250 H1150" stroke="#e3a0b8" fill="none"/>
  <circle cx="1012" cy="278" r="4" fill="#e3a0b8"/>
  <text x="1042" y="242" font-size="12" fill="#e3a0b8" letter-spacing="1">WIFI + BLUETOOTH</text>
  <text x="1042" y="272" font-size="13" fill="#b9b0dc">fan-cooled</text>
  <text x="1042" y="290" font-size="13" fill="#b9b0dc">aluminium body</text>
  <path d="M188 300 L140 340 H52" stroke="#e3a0b8" fill="none"/>
  <circle cx="188" cy="300" r="4" fill="#e3a0b8"/>
  <text x="52" y="332" font-size="13" fill="#e3a0b8" letter-spacing="1">7 CHANNELS</text>
  <text x="52" y="360" font-size="13" fill="#b9b0dc">96 LEDs,</text>
  <text x="52" y="378" font-size="13" fill="#b9b0dc">120° optics</text>
</g>

<!-- ============ Feature panels ============ -->
<!-- Panel 1: LED array + spectrum -->
<g transform="translate(60,1070)">
  <rect width="360" height="480" rx="22" fill="url(#panel)" stroke="#3a3170"/>
  <text x="24" y="40" class="serif" font-size="24" fill="url(#title)">Changing Spectrum</text>
  <text x="24" y="64" font-size="13" fill="#9d94c8">LED array, seen from below</text>
  <rect x="24" y="80" width="312" height="96" rx="14" fill="#101116" stroke="#2c2e38"/>
  <g id="ledArray"></g>
  <g id="specChart" transform="translate(24,200)"></g>
</g>

<!-- Panel 2: PAR + time of day -->
<g transform="translate(450,1070)">
  <rect width="370" height="480" rx="22" fill="url(#panel)" stroke="#3a3170"/>
  <text x="24" y="40" class="serif" font-size="24" fill="url(#title)">Changing PAR</text>
  <g id="parGauge" transform="translate(185,185)"></g>
  <line x1="24" y1="252" x2="346" y2="252" stroke="#3a3170"/>
  <text x="24" y="290" class="serif" font-size="24" fill="url(#title)">Changing Time of Day</text>
  <text x="24" y="314" font-size="13" fill="#e3a0b8">Gradual ramps · clouds · lunar cycle</text><g id="dayCycle" transform="translate(0,314)"></g>
</g>

<!-- Panel 3: phone app -->
<g>
  <text x="974" y="1070" text-anchor="middle" class="serif" font-size="24" fill="url(#title)">App Control</text>
  <rect x="850" y="1078" width="248" height="472" rx="34" fill="#0d0d12" stroke="#4a4d58" stroke-width="2" filter="url(#shadow)"/>
  <g clip-path="url(#phoneClip)">
    <rect x="858" y="1086" width="232" height="456" fill="#120f2b"/>
    <g id="app"></g>
  </g>
  <rect x="944" y="1094" width="60" height="14" rx="7" fill="#000"/>
</g>
</svg>

<script>
const NS="http://www.w3.org/2000/svg";
const $=id=>document.getElementById(id);
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
function txt(parent,x,y,s,attrs={}){const t=el('text',Object.assign({x,y},attrs),parent);t.textContent=s;return t;}
let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646;};
const R=(a,b)=>a+(b-a)*rnd();

// vents on top face
for(let i=0;i<28;i++){el('rect',{x:440+i*11.5,y:232,width:5,height:14,rx:2.5},$('vents'));}

// beams inside water
const beams=$('beams');
for(let i=0;i<8;i++){const cx=250+i*100;
  el('polygon',{points:`${cx-20},452 ${cx+20},452 ${cx+70},1012 ${cx-70},1012`,fill:'url(#beam)',opacity:.45},beams);}

// reef
const reef=$('reef');
// back rocks
function rockPath(x,y,w,h){let p=`M${x} ${y}`;const n=10;for(let i=0;i<=n;i++){const t=i/n;const px=x+w*t;const py=y-h*Math.sin(Math.PI*t)*R(.75,1.1);p+=` L${px.toFixed(1)} ${py.toFixed(1)}`;}return p+' Z';}
el('path',{d:rockPath(200,960,330,190),fill:'url(#rock)',opacity:.8},reef);
el('path',{d:rockPath(620,960,380,240),fill:'url(#rock)',opacity:.8},reef);
el('path',{d:rockPath(430,975,320,150),fill:'url(#rock)'},reef);
// rock texture dots
for(let i=0;i<160;i++){const x=R(210,990),y=R(800,970);el('circle',{cx:x,cy:y,r:R(1,3),fill:'#2b1a5a',opacity:.5},reef);}
// sand
el('path',{d:'M170 965 C 320 940, 480 975, 620 958 S 900 945, 1030 962 V1012 H170 Z',fill:'url(#sand)'},reef);
for(let i=0;i<220;i++){el('circle',{cx:R(172,1028),cy:R(968,1010),r:R(.6,1.6),fill:'#c9c4ff',opacity:R(.2,.6)},reef);}

// SPS branching coral
function branch(g,x,y,ang,len,w,depth,col,tip){
  const x2=x+Math.cos(ang)*len,y2=y+Math.sin(ang)*len;
  el('path',{d:`M${x} ${y} Q${(x+x2)/2+R(-6,6)} ${(y+y2)/2} ${x2} ${y2}`,stroke:col,'stroke-width':w,'stroke-linecap':'round',fill:'none'},g);
  if(depth===0){el('circle',{cx:x2,cy:y2,r:w*.75,fill:tip},g);return;}
  const n=rnd()<.6?2:3;
  for(let i=0;i<n;i++)branch(g,x2,y2,ang+R(-.65,.65),len*R(.62,.8),w*.75,depth-1,col,tip);
}
function sps(x,y,col,tip,scale=1){const g=el('g',{filter:'url(#glow)'},reef);for(let i=0;i<5;i++)branch(g,x+R(-10,10),y,-Math.PI/2+R(-.7,.7),38*scale,9*scale,3,col,tip);}
// table coral
function table(x,y,w,col,tip){const g=el('g',{filter:'url(#glow)'},reef);
  el('path',{d:`M${x-6} ${y} L${x-3} ${y-40} L${x+3} ${y-40} L${x+6} ${y} Z`,fill:col},g);
  el('ellipse',{cx:x,cy:y-44,rx:w,ry:10,fill:col},g);
  for(let i=0;i<40;i++){el('circle',{cx:x+R(-w*.95,w*.95),cy:y-46+R(-5,4),r:R(1.5,2.6),fill:tip},g);}}
// brain coral
function brain(x,y,r,col,line){const g=el('g',{filter:'url(#glow)'},reef);
  el('path',{d:`M${x-r} ${y} A${r} ${r*.8} 0 0 1 ${x+r} ${y} Z`,fill:col},g);
  for(let k=1;k<5;k++){let p='';for(let i=0;i<=24;i++){const t=Math.PI*i/24;const rr=r*(1-k*.18);const px=x-Math.cos(t)*rr;const py=y-Math.sin(t)*rr*.8+Math.sin(i*1.4)*3;p+=(i?'L':'M')+px.toFixed(1)+' '+py.toFixed(1);}el('path',{d:p,stroke:line,'stroke-width':2,fill:'none',opacity:.9},g);}}
// mushroom
function mush(x,y,r,col,ring){const g=el('g',{filter:'url(#glow)'},reef);
  el('ellipse',{cx:x,cy:y,rx:r,ry:r*.45,fill:col},g);
  el('ellipse',{cx:x,cy:y,rx:r*.65,ry:r*.28,fill:'none',stroke:ring,'stroke-width':2,'stroke-dasharray':'2 4'},g);
  el('ellipse',{cx:x,cy:y,rx:r*.18,ry:r*.08,fill:ring},g);}
// zoanthid cluster
function zoas(x,y,n,col,mouth){const g=el('g',{filter:'url(#glow)'},reef);
  for(let i=0;i<n;i++){const px=x+R(-30,30),py=y+R(-10,10);el('circle',{cx:px,cy:py,r:6,fill:col},g);el('circle',{cx:px,cy:py,r:2.5,fill:mouth},g);}}
// anemone / LPS tentacles
function anemone(x,y,col,tip,n=26,len=55){const g=el('g',{filter:'url(#glow)'},reef);
  for(let i=0;i<n;i++){const a=-Math.PI/2+R(-1.25,1.25);const l=len*R(.7,1);const x2=x+Math.cos(a)*l,y2=y+Math.sin(a)*l;
    el('path',{d:`M${x} ${y} Q${x+Math.cos(a)*l*.5+R(-12,12)} ${y+Math.sin(a)*l*.5} ${x2} ${y2}`,stroke:col,'stroke-width':6,'stroke-linecap':'round',fill:'none'},g);
    el('circle',{cx:x2,cy:y2,r:4,fill:tip},g);}}
// soft coral fronds / gorgonian
function gorgonian(x,y,col){const g=el('g',{filter:'url(#glow)',opacity:.9},reef);
  for(let i=0;i<4;i++)branch(g,x,y,-Math.PI/2+R(-.4,.4),55,4,4,col,col);}

gorgonian(290,800,'#ff5fa8');
gorgonian(930,740,'#ffb347');
sps(700,735,'#b07bff','#7dfff0',1.1);
sps(830,760,'#5cffb0','#e8ff7a',.9);
table(470,835,80,'#ff7ac6','#ffe1f3');
sps(330,790,'#4fd8ff','#c6ffff',.85);
brain(600,960,58,'#3dd68c','#e7ff6a');
brain(880,962,44,'#ff8a5c','#ffe2a3');
anemone(250,955,'#ff9b6a','#fff0b8',30,60);
anemone(760,958,'#d27bff','#7dfff0',22,45);
mush(400,880,34,'#3d7cff','#9fffe0');
mush(450,905,26,'#c43dff','#ffd36a');
mush(560,850,28,'#ff4f8b','#7dffef');
zoas(700,900,9,'#ff7a3d','#3dffb5');
zoas(340,925,8,'#3dff9e','#ff63c8');
zoas(960,900,7,'#ffe04d','#ff4fa3');

// fish (generic)
function fish(x,y,s,body,fin,flip){const g=el('g',{transform:`translate(${x},${y}) scale(${flip?-s:s},${s})`},reef);
  el('path',{d:'M-30 0 C -10 -22, 25 -20, 34 0 C 25 20, -10 22, -30 0 Z',fill:body},g);
  el('path',{d:'M-28 0 L-50 -16 L-46 0 L-50 16 Z',fill:fin},g);
  el('path',{d:'M-6 -16 Q 6 -30 18 -14',fill:fin},g);
  el('circle',{cx:22,cy:-4,r:3.2,fill:'#0b0820'},g);
  el('path',{d:'M4 -14 Q 10 0 4 14',stroke:'#fff',fill:'none','stroke-width':3,opacity:.85},g);}
fish(620,600,1.1,'#ffb03d','#ff7a1a',false);
fish(380,660,.75,'#5ad0ff','#2a6bff',true);
fish(860,560,.6,'#ffe14d','#ffb000',true);
// bubbles
for(let i=0;i<18;i++)el('circle',{cx:R(900,1010),cy:R(480,800),r:R(1.5,4),fill:'none',stroke:'#cfe0ff','stroke-opacity':.5},reef);

// caustics
const ca=$('caustics');
for(let i=0;i<26;i++){const x=R(180,1000),y=R(940,1005);el('path',{d:`M${x} ${y} q 10 -6 20 0 t 20 0`,stroke:'#e0f0ff','stroke-width':1.5,fill:'none'},ca);}

// PAR tags on right side of tank
const tags=$('parTags');
[[520,'PAR 420','SPS zone'],[700,'PAR 260','LPS zone'],[900,'PAR 120','soft corals']].forEach(([y,a,b])=>{
  el('line',{x1:1030,y1:y,x2:1048,y2:y,stroke:'#d9b47a'},tags);
  el('circle',{cx:1030,cy:y,r:3.5,fill:'#d9b47a'},tags);
  txt(tags,1054,y+2,a,{'font-size':15,fill:'#f1d9a8','font-weight':'bold'});
  txt(tags,1054,y+20,b,{'font-size':12,fill:'#b9b0dc'});
});
el('path',{d:'M1040 535 V 880',stroke:'#d9b47a','stroke-dasharray':'3 5',opacity:.5},tags);

// LED array (underside view)
const LEDC={uv:'#8a3dff',vi:'#a66bff',rb:'#3f5bff',bl:'#2fa8ff',gr:'#3dff9a',wh:'#f4f6ff',rd:'#ff3d5a'};
const arr=$('ledArray');
const pattern=['rb','wh','vi','bl','rb','uv','rb','gr','bl','rd','rb','vi'];
for(let c=0;c<4;c++){const cx=24+44+c*75,cy=128;
  el('circle',{cx,cy,r:30,fill:'#1c1d24',stroke:'#2f313b'},arr);
  for(let k=0;k<12;k++){const a=k/12*Math.PI*2,rr=k%2?20:13;const px=cx+Math.cos(a)*rr,py=cy+Math.sin(a)*rr;
    el('circle',{cx:px,cy:py,r:3.8,fill:LEDC[pattern[(k+c*3)%12]],filter:'url(#glow)'},arr);}
  el('circle',{cx,cy,r:5,fill:'#fff',filter:'url(#glow)'},arr);}

// spectrum chart
const sc=$('specChart');
el('rect',{x:0,y:0,width:312,height:150,rx:10,fill:'#0f0c26'},sc);
// curve
const peaks=[[400,.55],[420,.7],[450,1],[470,.6],[520,.25],[560,.3],[620,.22],[660,.28]];
let d='M10 140';const W=292;
for(let nm=380;nm<=700;nm+=4){let v=0.04;peaks.forEach(([p,h])=>{v+=h*Math.exp(-((nm-p)**2)/(2*13**2));});v=Math.min(v,1.05);
  const x=10+(nm-380)/320*W,y=140-v*115;d+=` L${x.toFixed(1)} ${y.toFixed(1)}`;}
d+=' L302 140 Z';
el('path',{d,fill:'url(#spec)',opacity:.9},sc);
el('path',{d:d.replace(' L302 140 Z','').replace('M10 140 L','M'),stroke:'#fff','stroke-width':1.5,fill:'none',opacity:.8},sc);
[[380,'380'],[450,'450'],[550,'550'],[650,'650 nm']].forEach(([nm,l])=>txt(sc,10+(nm-380)/320*W,166,l,{'font-size':11,fill:'#9d94c8','text-anchor':nm===650?'start':'middle'}));
// channel chips
const chans=[['UV',LEDC.uv],['Violet',LEDC.vi],['Royal',LEDC.rb],['Blue',LEDC.bl],['Green',LEDC.gr],['White',LEDC.wh],['Red',LEDC.rd]];
chans.forEach(([n,c],i)=>{const x=(i%4)*78,y=192+Math.floor(i/4)*28;
  el('circle',{cx:x+8,cy:y,r:6,fill:c,filter:'url(#glow)'},sc);txt(sc,x+20,y+5,n,{'font-size':13,fill:'#e9e3ff'});});

// PAR gauge
const g=$("parGauge");
const arc=(r,a0,a1)=>{const p=a=>[Math.cos(a)*r,Math.sin(a)*r];const [x0,y0]=p(a0),[x1,y1]=p(a1);return `M${x0} ${y0} A${r} ${r} 0 ${a1-a0>Math.PI?1:0} 1 ${x1} ${y1}`;};
el('path',{d:arc(100,Math.PI,2*Math.PI),stroke:'#2a2456','stroke-width':18,fill:'none','stroke-linecap':'round'},g);
const val=280/500;
el('path',{d:arc(100,Math.PI,Math.PI+Math.PI*val),stroke:'url(#gauge)','stroke-width':18,fill:'none','stroke-linecap':'round',filter:'url(#glow)'},g);
for(let i=0;i<=10;i++){const a=Math.PI+Math.PI*i/10;el('line',{x1:Math.cos(a)*118,y1:Math.sin(a)*118,x2:Math.cos(a)*(i%5?123:128),y2:Math.sin(a)*(i%5?123:128),stroke:'#6d64a8'},g);}
txt(g,0,-22,'280',{'text-anchor':'middle','font-size':44,fill:'#fff','font-weight':'bold'});
txt(g,0,4,'µmol/m²/s',{'text-anchor':'middle','font-size':13,fill:'#9d94c8'});
txt(g,-128,30,'0',{'text-anchor':'middle','font-size':12,fill:'#9d94c8'});
txt(g,128,30,'500',{'text-anchor':'middle','font-size':12,fill:'#9d94c8'});
txt(g,0,50,'10–100% dimming per channel',{'text-anchor':'middle','font-size':13,fill:'#e3a0b8'});

// Day cycle
const dc=$('dayCycle');
const cx=185,cy=118,r=95;
el('line',{x1:40,y1:cy,x2:330,y2:cy,stroke:'#3a3170'},dc);
el('path',{d:`M${cx-r} ${cy} A ${r} ${r*.8} 0 0 1 ${cx+r} ${cy}`,stroke:'url(#dayArc)','stroke-width':5,fill:'none',filter:'url(#glow)'},dc);
const pts=[[0,'#ff9a5c','06:00','Sunrise'],[.5,'#ffffff','12:00','Midday'],[.82,'#ff7aa8','18:00','Sunset'],[1,'#7d8bff','21:00','Moonlight']];
pts.forEach(([t,c,time,name])=>{const a=Math.PI*(1-t);const x=cx+Math.cos(a)*r,y=cy-Math.sin(a)*r*.8;
  el('circle',{cx:x,cy:y,r:t===.5?13:8,fill:c,filter:'url(#glow)'},dc);
  const lx=t===0?x-6:t===1?x+6:x; const anchor=t===0?'start':t===1?'end':'middle';
  if(t===.5){txt(dc,x,y-22,time+'  '+name,{'text-anchor':'middle','font-size':13,fill:'#fff','font-weight':'bold'});return;}
  const ly=t===.82?y-20:cy+24;
  txt(dc,t===.82?x+22:lx,ly,time,{'text-anchor':t===.82?'start':anchor,'font-size':13,fill:'#fff','font-weight':'bold'});
  txt(dc,t===.82?x+22:lx,ly+16,name,{'text-anchor':t===.82?'start':anchor,'font-size':12,fill:'#9d94c8'});});


// App
const app=$('app');const ax=858,ay=1086;
txt(app,ax+18,ay+46,'9:41',{'font-size':11,fill:'#fff'});
txt(app,ax+18,ay+76,'Lumen Reef 60',{'font-size':16,fill:'#fff','font-weight':'bold'});
el('circle',{cx:ax+206,cy:ay+71,r:5,fill:'#7dffb2'},app);
txt(app,ax+18,ay+94,'Connected · Reef mode',{'font-size':10,fill:'#9d94c8'});
// schedule graph
el('rect',{x:ax+14,y:ay+106,width:204,height:100,rx:12,fill:'#1d1842'},app);
let gp='';for(let i=0;i<=48;i++){const t=i/48;let v=Math.max(0,Math.sin((t-.25)/.5*Math.PI));if(t<.25||t>.75)v=0;const x=ax+24+t*184,y=ay+190-v*66-(t>.78&&t<.95?8:0);gp+=(i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1);}
el('path',{d:gp+` L${ax+208} ${ay+190} L${ax+24} ${ay+190} Z`,fill:'url(#gauge)',opacity:.35},app);
el('path',{d:gp,stroke:'url(#gauge)','stroke-width':2.5,fill:'none'},app);
el('line',{x1:ax+24+.55*184,y1:ay+116,x2:ax+24+.55*184,y2:ay+192,stroke:'#fff','stroke-dasharray':'2 3'},app);
txt(app,ax+24,ay+124,'24 h schedule',{'font-size':10,fill:'#b9b0dc'});
['0','6','12','18','24'].forEach((l,i)=>txt(app,ax+24+i*46,ay+202,l,{'font-size':8,fill:'#7d74a8','text-anchor':'middle'}));
// mode chips
['Sunrise','Midday','Sunset','Moon'].forEach((m,i)=>{const x=ax+14+i*52;const on=i===1;
  el('rect',{x,y:ay+218,width:48,height:22,rx:11,fill:on?'url(#accent)':'#1d1842'},app);
  txt(app,x+24,ay+233,m,{'font-size':9,fill:on?'#1a1030':'#cfc8f0','text-anchor':'middle','font-weight':on?'bold':'normal'});});
// sliders
const sl=[['UV',LEDC.uv,.55],['Violet',LEDC.vi,.7],['Royal Blue',LEDC.rb,.95],['Blue',LEDC.bl,.6],['Green',LEDC.gr,.2],['White',LEDC.wh,.35],['Red',LEDC.rd,.15]];
sl.forEach(([n,c,v],i)=>{const y=ay+262+i*25;
  txt(app,ax+18,y,n,{'font-size':10,fill:'#e9e3ff'});
  txt(app,ax+214,y,Math.round(v*100)+'%',{'font-size':10,fill:'#9d94c8','text-anchor':'end'});
  el('rect',{x:ax+18,y:y+5,width:196,height:4,rx:2,fill:'#2a2456'},app);
  el('rect',{x:ax+18,y:y+5,width:196*v,height:4,rx:2,fill:c},app);
  el('circle',{cx:ax+18+196*v,cy:y+7,r:5,fill:'#fff'},app);});
// PAR + temp tiles
[['PAR','280'],['Kelvin','14K'],['Power','62W']].forEach(([k,v],i)=>{const x=ax+14+i*69;
  el('rect',{x,y:ay+440-0,width:63,height:0,fill:'none'},app);});
el('rect',{x:ax+14,y:ay+432,width:204,height:16,rx:8,fill:'none'},app);
</script>
