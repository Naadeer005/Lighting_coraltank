<!doctype html>
<html><head><meta charset="utf-8"><title>Lumen Lineup</title>
<style>
html,body{margin:0;background:#0b0820}
svg{display:block}
text{font-family:"DejaVu Sans",Arial,sans-serif}
.serif{font-family:"DejaVu Serif",Georgia,serif}
.th{font-family:"Loma","FreeSerif",sans-serif}
</style></head>
<body>
<svg id="s" width="1200" height="1600" viewBox="0 0 1200 1600" xmlns="http://www.w3.org/2000/svg">
<defs>
  <radialGradient id="bg" cx="50%" cy="35%" r="80%">
    <stop offset="0" stop-color="#2a1d6b"/><stop offset=".55" stop-color="#140f3c"/><stop offset="1" stop-color="#07051a"/>
  </radialGradient>
  <linearGradient id="title" x1="0" x2="1"><stop offset="0" stop-color="#e07ae6"/><stop offset="1" stop-color="#d9b47a"/></linearGradient>
  <linearGradient id="accent" x1="0" x2="1"><stop offset="0" stop-color="#e07ae6"/><stop offset=".5" stop-color="#e3a0b8"/><stop offset="1" stop-color="#d9b47a"/></linearGradient>
  <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#555965"/><stop offset=".45" stop-color="#2c2e36"/><stop offset="1" stop-color="#141519"/>
  </linearGradient>
  <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#6b707d"/><stop offset=".5" stop-color="#3a3d47"/><stop offset="1" stop-color="#25272e"/>
  </linearGradient>
  <linearGradient id="side" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#1a1b21"/><stop offset=".3" stop-color="#4a4e5a"/><stop offset=".55" stop-color="#2a2c34"/><stop offset="1" stop-color="#121317"/>
  </linearGradient>
  <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#cdddff" stop-opacity=".55"/><stop offset=".4" stop-color="#6f7dff" stop-opacity=".18"/><stop offset="1" stop-color="#5b3cff" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#211b4d" stop-opacity=".9"/><stop offset="1" stop-color="#110d2b" stop-opacity=".95"/>
  </linearGradient>
  <linearGradient id="glassG" x1="0" x2="1"><stop offset="0" stop-color="#bcd2ff" stop-opacity=".5"/><stop offset="1" stop-color="#5a7cff" stop-opacity=".2"/></linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="bigGlow" x="-50%" y="-300%" width="200%" height="700%"><feGaussianBlur stdDeviation="16"/></filter>
  <filter id="shadow" x="-20%" y="-30%" width="140%" height="180%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity=".55"/></filter>
</defs>

<rect width="1200" height="1600" fill="url(#bg)"/>
<text x="70" y="92" class="serif" font-size="46" fill="url(#title)">Lumen Product Line</text>
<text x="72" y="128" font-size="17" fill="#b9b0dc" letter-spacing="3">FOUR SHAPES · ONE SMART LED SYSTEM</text>

<g id="c1" transform="translate(60,170)"></g>
<g id="c2" transform="translate(620,170)"></g>
<g id="c3" transform="translate(60,875)"></g>
<g id="c4" transform="translate(620,875)"></g>

<text x="600" y="1572" text-anchor="middle" font-size="13" fill="#8d84b8" letter-spacing="1">All models: 7 colour channels · adjustable PAR · sunrise to moonlight schedule · app control</text>
</svg>

<script>
const NS="http://www.w3.org/2000/svg";
const $=id=>document.getElementById(id);
function el(tag,a,p){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;}
function txt(p,x,y,s,a={}){const t=el('text',Object.assign({x,y},a),p);t.textContent=s;return t;}
const LED=['#3f5bff','#f4f6ff','#a66bff','#2fa8ff','#3f5bff','#8a3dff','#3f5bff','#3dff9a','#2fa8ff','#ff3d5a','#3f5bff','#a66bff'];
function cluster(g,cx,cy,r,off=0){
  el('circle',{cx,cy,r:r*1.25,fill:'#1c1d24',stroke:'#30323c'},g);
  for(let k=0;k<12;k++){const a=k/12*Math.PI*2,rr=k%2?r*.8:r*.5;
    el('circle',{cx:cx+Math.cos(a)*rr,cy:cy+Math.sin(a)*rr,r:r*.15,fill:LED[(k+off)%12],filter:'url(#glow)'},g);}
  el('circle',{cx,cy,r:r*.2,fill:'#fff',filter:'url(#glow)'},g);
}
function card(g,o){
  el('rect',{width:520,height:680,rx:26,fill:'url(#card)',stroke:'#3a3170'},g);
  // floor glow + beam
  el('polygon',{points:o.beam,fill:'url(#beam)'},g);
  const prod=el('g',{},g); o.draw(prod);
  // text
  txt(g,30,440,o.name,{class:'serif','font-size':30,fill:'url(#title)'});
  txt(g,30,476,o.th,{class:'th','font-size':26,fill:'#e3a0b8','font-weight':'bold'});
  txt(g,30,512,o.dim,{'font-size':16,fill:'#f1d9a8','font-weight':'bold'});
  o.specs.forEach((s,i)=>{el('circle',{cx:36,cy:540+i*26,r:3,fill:'#e3a0b8'},g);txt(g,48,545+i*26,s,{'font-size':14,fill:'#d8d1f5'});});
  const w=o.tag.length*7.4+28;
  el('rect',{x:30,y:632,width:w,height:28,rx:14,fill:'none',stroke:'url(#accent)'},g);
  txt(g,30+w/2,651,o.tag,{'font-size':13,fill:'#f1d9a8','text-anchor':'middle'});
  // underside inset
  const u=el('g',{transform:'translate(320,430)'},g);
  el('rect',{width:170,height:170,rx:18,fill:'#0d0b22',stroke:'#3a3170'},u);
  txt(u,85,160,'underside',{'font-size':11,fill:'#8d84b8','text-anchor':'middle','letter-spacing':1});
  o.under(u);
}

/* 1. ROUND */
card($('c1'),{name:'Lumen Orb',th:'แบบกลม',dim:'Ø 22 cm · 75 W',
  specs:['Hanging pendant with steel cable','3 rings of LEDs, wide 120° spread','Even light from one centre point'],
  tag:'Best for: cube & open-top tanks',
  beam:'130,262 390,262 470,400 50,400',
  draw(g){
    el('line',{x1:260,y1:20,x2:260,y2:168,stroke:'#9aa0ad','stroke-width':2},g);
    el('line',{x1:200,y1:20,x2:255,y2:168,stroke:'#9aa0ad','stroke-width':1.2,opacity:.6},g);
    el('line',{x1:320,y1:20,x2:265,y2:168,stroke:'#9aa0ad','stroke-width':1.2,opacity:.6},g);
    el('ellipse',{cx:260,cy:262,rx:150,ry:22,fill:'#9fb4ff',filter:'url(#bigGlow)'},g);
    const b=el('g',{filter:'url(#shadow)'},g);
    el('path',{d:'M110 205 L110 238 A150 40 0 0 0 410 238 L410 205 Z',fill:'url(#side)'},b);
    el('ellipse',{cx:260,cy:205,rx:150,ry:40,fill:'url(#top)'},b);
    for(let i=0;i<48;i++){const a=i/48*Math.PI*2;
      el('line',{x1:260+Math.cos(a)*58,y1:205+Math.sin(a)*15.5,x2:260+Math.cos(a)*138,y2:205+Math.sin(a)*37,stroke:'#1b1c22','stroke-width':2.2,opacity:.75},g);}
    el('ellipse',{cx:260,cy:205,rx:52,ry:14,fill:'#2a2c34',stroke:'#6b707d'},g);
    el('ellipse',{cx:260,cy:203,rx:16,ry:5,fill:'#9aa0ad'},g);
    el('path',{d:'M112 240 A150 40 0 0 0 408 240',stroke:'url(#accent)','stroke-width':3,fill:'none',filter:'url(#glow)'},g);
    el('path',{d:'M125 244 A135 34 0 0 0 395 244',stroke:'#e8eeff','stroke-width':3,fill:'none',filter:'url(#glow)',opacity:.9},g);
    el('circle',{cx:392,cy:226,r:3.5,fill:'#7dffb2',filter:'url(#glow)'},g);
  },
  under(u){
    el('circle',{cx:85,cy:75,r:64,fill:'#1a1b22',stroke:'#3a3d47','stroke-width':2},u);
    el('circle',{cx:85,cy:75,r:64,fill:'none',stroke:'url(#accent)','stroke-width':2},u);
    [[52,24],[34,16],[16,8]].forEach(([r,n],j)=>{for(let k=0;k<n;k++){const a=k/n*Math.PI*2+j*.2;
      el('circle',{cx:85+Math.cos(a)*r,cy:75+Math.sin(a)*r,r:3.6,fill:LED[(k*5+j)%12],filter:'url(#glow)'},u);}});
    el('circle',{cx:85,cy:75,r:5,fill:'#fff',filter:'url(#glow)'},u);
  }});

/* 2. LONG BAR */
card($('c2'),{name:'Lumen Bar',th:'แบบยาว',dim:'60 cm · 62 W',
  specs:['Slim bar covers the full tank length','96 LEDs in 8 clusters','Adjustable mounting legs'],
  tag:'Best for: 60 cm rectangle tanks',
  beam:'45,232 475,232 515,400 5,400',
  draw(g){
    el('ellipse',{cx:260,cy:236,rx:220,ry:14,fill:'#9fb4ff',filter:'url(#bigGlow)'},g);
    // legs
    [[80,-1],[440,1]].forEach(([x,d])=>{
      el('path',{d:`M${x} 225 C ${x} 270, ${x+d*14} 300, ${x+d*14} 330`,stroke:'#2a2c34','stroke-width':8,fill:'none','stroke-linecap':'round'},g);
      el('rect',{x:x+d*14-14,y:326,width:28,height:16,rx:4,fill:'#2a2c34',stroke:'#555a66'},g);});
    const b=el('g',{filter:'url(#shadow)'},g);
    el('path',{d:'M58 170 H462 Q478 170 488 190 L492 196 H28 L32 190 Q42 170 58 170 Z',fill:'url(#top)'},b);
    el('rect',{x:28,y:194,width:464,height:36,rx:11,fill:'url(#front)'},b);
    for(let i=0;i<20;i++)el('rect',{x:204+i*5.8,y:177,width:3,height:11,rx:1.5,fill:'#16171c'},g);
    el('rect',{x:40,y:223,width:440,height:2.5,rx:1,fill:'url(#accent)',filter:'url(#glow)'},g);
    el('rect',{x:44,y:229,width:432,height:3,rx:1.5,fill:'#e8eeff',filter:'url(#glow)'},g);
    txt(g,260,216,'LUMEN',{'text-anchor':'middle','font-size':10,'letter-spacing':5,fill:'#c9cbd6'});
    el('circle',{cx:466,cy:212,r:3.5,fill:'#7dffb2',filter:'url(#glow)'},g);
    // dimension
    el('path',{d:'M28 140 H492 M28 132 V148 M492 132 V148',stroke:'#d9b47a','stroke-width':1.3,fill:'none'},g);
    el('rect',{x:226,y:128,width:68,height:24,rx:12,fill:'#16123a'},g);
    txt(g,260,145,'60 cm',{'text-anchor':'middle','font-size':14,fill:'#f1d9a8','font-weight':'bold'});
  },
  under(u){
    el('rect',{x:8,y:52,width:154,height:44,rx:12,fill:'#1a1b22',stroke:'url(#accent)','stroke-width':1.5},u);
    for(let i=0;i<4;i++)cluster(u,28+i*38,74,13,i*3);
    txt(u,85,124,'(4 of 8 clusters shown)',{'font-size':9,fill:'#6d64a8','text-anchor':'middle'});
  }});

/* 3. SQUARE */
card($('c3'),{name:'Lumen Tile',th:'แบบสี่เหลี่ยม',dim:'20 × 20 cm · 90 W',
  specs:['Highest PAR for SPS corals','Large heatsink, silent fan','Swing arm, rotates 360°'],
  tag:'Best for: deep tanks & hard corals',
  beam:'110,240 330,240 420,400 20,400',
  draw(g){
    el('ellipse',{cx:220,cy:240,rx:110,ry:18,fill:'#9fb4ff',filter:'url(#bigGlow)'},g);
    // arm + post
    el('path',{d:'M220 150 C 240 70, 330 40, 420 60 L 440 70',stroke:'#2a2c34','stroke-width':10,fill:'none','stroke-linecap':'round'},g);
    el('path',{d:'M220 150 C 240 70, 330 40, 420 60',stroke:'#8a8f9c','stroke-width':2,fill:'none',opacity:.5},g);
    el('rect',{x:432,y:60,width:14,height:270,rx:6,fill:'url(#side)'},g);
    el('rect',{x:418,y:326,width:42,height:18,rx:4,fill:'#2a2c34',stroke:'#555a66'},g);
    el('circle',{cx:439,cy:66,r:9,fill:'#3a3d47',stroke:'#6b707d'},g);
    const b=el('g',{filter:'url(#shadow)'},g);
    // box: top rhombus + two side faces
    el('polygon',{points:'220,110 340,160 220,210 100,160',fill:'url(#top)'},b);
    el('polygon',{points:'100,160 220,210 220,236 100,186',fill:'url(#front)'},b);
    el('polygon',{points:'220,210 340,160 340,186 220,236',fill:'#1d1f25'},b);
    for(let i=1;i<12;i++){const t=i/12;
      el('line',{x1:100+120*t,y1:160-50*t+0,x2:220+120*t,y2:210-50*t,stroke:'#17181d','stroke-width':3,opacity:.8},g);}
    el('circle',{cx:220,cy:160,r:16,fill:'#2a2c34',stroke:'#6b707d'},g);
    el('polyline',{points:'100,186 220,236 340,186',stroke:'url(#accent)','stroke-width':3,fill:'none',filter:'url(#glow)'},g);
    el('circle',{cx:320,cy:180,r:3.2,fill:'#7dffb2',filter:'url(#glow)'},g);
  },
  under(u){
    el('rect',{x:22,y:12,width:126,height:126,rx:16,fill:'#1a1b22',stroke:'url(#accent)','stroke-width':1.5},u);
    [[55,45],[115,45],[55,105],[115,105]].forEach(([x,y],i)=>cluster(u,x,y,17,i*4));
  }});

/* 4. CLIP-ON NANO */
card($('c4'),{name:'Lumen Nano',th:'แบบหนีบ',dim:'14 cm · 30 W',
  specs:['Clips onto the glass edge','Flexible gooseneck arm','Spot light for one coral area'],
  tag:'Best for: nano tanks & frag areas',
  beam:'110,212 270,212 340,400 40,400',
  draw(g){
    // glass wall with water
    el('rect',{x:360,y:230,width:14,height:170,fill:'url(#glassG)'},g);
    el('rect',{x:374,y:258,width:120,height:142,fill:'#3550c8',opacity:.25},g);
    el('line',{x1:374,y1:258,x2:494,y2:258,stroke:'#cfe0ff',opacity:.5},g);
    // clamp
    el('path',{d:'M346 222 H388 V300 H378 V234 H356 V300 H346 Z',fill:'#2a2c34',stroke:'#555a66'},g);
    el('rect',{x:386,y:270,width:16,height:10,rx:3,fill:'#3a3d47'},g);
    // gooseneck
    const p='M367 222 C 372 120, 330 70, 250 90 C 220 98, 205 120, 200 150';
    el('path',{d:p,stroke:'#22242b','stroke-width':12,fill:'none','stroke-linecap':'round'},g);
    el('path',{d:p,stroke:'#6b707d','stroke-width':12,fill:'none','stroke-dasharray':'2 4',opacity:.7},g);
    el('ellipse',{cx:190,cy:212,rx:85,ry:13,fill:'#9fb4ff',filter:'url(#bigGlow)'},g);
    const b=el('g',{filter:'url(#shadow)'},g);
    el('path',{d:'M128 160 H252 Q272 160 282 180 L284 186 H96 L98 180 Q108 160 128 160 Z',fill:'url(#top)'},b);
    el('rect',{x:96,y:184,width:188,height:26,rx:10,fill:'url(#front)'},b);
    for(let i=0;i<10;i++)el('rect',{x:162+i*6,y:166,width:3,height:10,rx:1.5,fill:'#16171c'},g);
    el('rect',{x:106,y:204,width:168,height:2.5,fill:'url(#accent)',filter:'url(#glow)'},g);
    el('rect',{x:110,y:209,width:160,height:3,rx:1.5,fill:'#e8eeff',filter:'url(#glow)'},g);
    el('circle',{cx:268,cy:196,r:3,fill:'#7dffb2',filter:'url(#glow)'},g);
  },
  under(u){
    el('rect',{x:14,y:46,width:142,height:58,rx:16,fill:'#1a1b22',stroke:'url(#accent)','stroke-width':1.5},u);
    cluster(u,55,75,18,1);cluster(u,115,75,18,6);
  }});
</script>
</body></html>
