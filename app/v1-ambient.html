<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumen · Ambient</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root { --light: rgb(80,90,255); --lvl: .5; --ink: #f6f7ff; --ink-2: rgba(246,247,255,.72); --ink-3: rgba(246,247,255,.5); }
* { box-sizing: border-box; margin: 0; }
html { background: #05060c; }
body {
  font-family: Onest, system-ui, sans-serif; color: var(--ink); min-height: 100vh; font-variant-numeric: tabular-nums;
  background:
    radial-gradient(120% 80% at 50% -10%, color-mix(in oklab, var(--light) calc(var(--lvl) * 85% + 10%), transparent) 0%, transparent 70%),
    linear-gradient(180deg, color-mix(in oklab, var(--light) calc(var(--lvl) * 30% + 6%), #05060c) 0%, #05060c 100%);
  transition: background 1.2s cubic-bezier(.2,.8,.2,1);
}
::selection { background: color-mix(in oklab, var(--light) 60%, white); color: #05060c; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; border-radius: 6px; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 28px 32px 40px; display: grid; gap: 28px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.brand { font-weight: 600; font-size: 18px; letter-spacing: -.01em; }
.brand span { font-weight: 300; color: var(--ink-2); }
.status { display: flex; align-items: center; gap: 14px; font-size: 13px; color: var(--ink-2); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: #5df2a7; display: inline-block; margin-right: 6px; }
.dot.saving { background: #ffd36b; } .dot.error { background: #ff6b6b; }
button { font: inherit; color: inherit; cursor: pointer; }
.chip { border: 1px solid rgba(255,255,255,.22); background: rgba(255,255,255,.04); border-radius: 999px; padding: 7px 14px; font-size: 13px; transition: background .2s, border-color .2s; }
.chip:hover { background: rgba(255,255,255,.1); }
.chip[aria-pressed="true"] { background: var(--ink); color: #05060c; border-color: var(--ink); }

.hero { display: grid; grid-template-columns: 1.1fr 1fr; gap: 40px; align-items: end; min-height: 300px; }
.readout .phase { font-size: 15px; color: var(--ink-2); display: flex; gap: 10px; align-items: baseline; }
.readout .phase b { font-weight: 500; color: var(--ink); font-size: 22px; }
.par { font-size: clamp(88px, 13vw, 168px); font-weight: 300; letter-spacing: -.04em; line-height: .9; margin-top: 12px; }
.par small { font-size: 18px; letter-spacing: 0; color: var(--ink-2); font-weight: 400; margin-left: 10px; }
.note { font-size: 12px; color: var(--ink-3); margin-top: 10px; }
.presets { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }

/* day ribbon: the light's 24 hours, painted with its own colors */
.ribbon { position: relative; height: 120px; border-radius: 14px; overflow: hidden; cursor: ew-resize; touch-action: none; background: #05060c; }
.ribbon canvas { width: 100%; height: 100%; display: block; }
.ribbon .head { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--ink); box-shadow: 0 0 0 1px rgba(0,0,0,.25); pointer-events: none; }
.ribbon .head span { position: absolute; top: 8px; left: 8px; font-size: 13px; font-weight: 500; white-space: nowrap; text-shadow: 0 1px 3px rgba(0,0,0,.6); }
.hours { display: flex; justify-content: space-between; font-size: 11px; color: var(--ink-3); margin-top: 6px; }
.timebar { display: flex; gap: 8px; align-items: center; margin-top: 12px; flex-wrap: wrap; }

.grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 28px; }
.panel { background: rgba(5,6,12,.55); border-radius: 16px; padding: 22px 24px; }
.panel h2 { font-size: 15px; font-weight: 500; margin-bottom: 16px; display: flex; justify-content: space-between; }
.panel h2 span { color: var(--ink-3); font-weight: 400; font-size: 13px; }
.ch { display: grid; grid-template-columns: 96px 1fr 44px; align-items: center; gap: 14px; padding: 7px 0; font-size: 14px; }
.ch output { text-align: right; color: var(--ink-2); }
.ch label { display: flex; align-items: center; gap: 8px; }
.ch label i { width: 10px; height: 10px; border-radius: 50%; }
.ch.master { border-bottom: 1px solid rgba(255,255,255,.1); padding-bottom: 14px; margin-bottom: 6px; font-weight: 500; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 22px; background: transparent; --c: var(--ink); --p: 50%; }
input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 4px; background: linear-gradient(90deg, var(--c) var(--p), rgba(255,255,255,.16) var(--p)); }
input[type=range]::-moz-range-track { height: 4px; border-radius: 4px; background: linear-gradient(90deg, var(--c) var(--p), rgba(255,255,255,.16) var(--p)); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: #fff; margin-top: -6px; box-shadow: 0 2px 6px rgba(0,0,0,.4); }
input[type=range]::-moz-range-thumb { width: 16px; height: 16px; border: 0; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.4); }
.sched { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.sched label { display: grid; gap: 6px; font-size: 12px; color: var(--ink-3); }
.sched input { font: inherit; font-size: 16px; color: var(--ink); background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.14); border-radius: 10px; padding: 9px 10px; color-scheme: dark; }
.log { margin-top: 18px; font-size: 12px; color: var(--ink-3); display: grid; gap: 4px; max-height: 120px; overflow: auto; }
.log b { color: var(--ink-2); font-weight: 500; }
.log .bad { color: #ff8a8a; }
.err { display: none; margin-top: 12px; font-size: 13px; color: #ffb3b3; }
.err.show { display: block; }
.err button { text-decoration: underline; background: none; border: 0; padding: 0; }
@media (max-width: 860px) { .hero, .grid { grid-template-columns: 1fr; } .presets { justify-content: flex-start; } .wrap { padding: 20px 16px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">Lumen Reef 60 <span>· 60 cm reef light</span></div>
    <div class="status">
      <span><i class="dot" id="dot"></i><span id="sync">Connecting…</span></span>
      <button class="chip" id="online" aria-pressed="true">Light online</button>
    </div>
  </header>

  <section class="hero">
    <div class="readout">
      <div class="phase"><b id="phase">Midday</b><span id="time">12:00</span><span id="mode">live</span></div>
      <div class="par"><span id="par">0</span><small>µmol/m²/s PAR</small></div>
      <p class="note">Estimated PAR at mid-depth. Simulated: no hardware connected yet.</p>
    </div>
    <div class="presets" id="presets" aria-label="Presets"></div>
  </section>

  <section>
    <div class="ribbon" id="ribbon" role="slider" tabindex="0" aria-label="Preview time of day" aria-valuemin="0" aria-valuemax="24">
      <canvas id="ribbonCv"></canvas>
      <div class="head" id="head"><span id="headLbl"></span></div>
    </div>
    <div class="hours"><span>00</span><span>03</span><span>06</span><span>09</span><span>12</span><span>15</span><span>18</span><span>21</span><span>24</span></div>
    <div class="timebar">
      <button class="chip" id="live">Now</button>
      <button class="chip" id="play">Play a day in 40 s</button>
    </div>
  </section>

  <section class="grid">
    <div class="panel">
      <h2>Spectrum <span id="presetName">Coral Pop</span></h2>
      <div id="channels"></div>
    </div>
    <div class="panel">
      <h2>Schedule <span>ramps &amp; moonlight</span></h2>
      <div class="sched" id="sched"></div>
      <h2 style="margin-top:22px">Device API <span>mock · 192.168.1.60</span></h2>
      <div class="log" id="log"></div>
      <p class="err" id="err">Can't reach the light. Changes are kept here. <button id="retry">Try again</button></p>
    </div>
  </section>
</div>
<script src="lumen-core.js"></script>
<script>
const L = Lumen, $ = (id) => document.getElementById(id);
const SCHED = [['sunriseStart','Sunrise starts'],['sunriseEnd','Full light'],['sunsetStart','Sunset starts'],['sunsetEnd','Lights out']];
const toH = (s) => { const [h, m] = s.split(':').map(Number); return h + m / 60; };

$('presets').innerHTML = L.PRESETS.map(p => `<button class="chip" data-p="${p.id}" title="${p.note}">${p.name}</button>`).join('');
$('presets').onclick = (e) => e.target.dataset.p && L.applyPreset(e.target.dataset.p);
$('channels').innerHTML = `<div class="ch master"><label for="m">Master</label><input id="m" type="range" min="0" max="100"><output id="mo"></output></div>` +
  L.CHANNELS.map(c => `<div class="ch"><label for="c-${c.id}"><i style="background:${c.color}"></i>${c.name}</label><input id="c-${c.id}" type="range" min="0" max="100" style="--c:${c.color}"><output id="o-${c.id}"></output></div>`).join('');
L.CHANNELS.forEach(c => $('c-' + c.id).oninput = (e) => L.setChannel(c.id, +e.target.value));
$('m').oninput = (e) => L.setMaster(+e.target.value);
$('sched').innerHTML = SCHED.map(([k, n]) => `<label>${n}<input type="time" step="900" data-k="${k}"></label>`).join('') +
  `<label>Moonlight<input type="number" min="0" max="20" data-k="moon"></label>`;
$('sched').onchange = (e) => { const k = e.target.dataset.k; if (k) L.setSchedule(k, k === 'moon' ? L.clamp(+e.target.value, 0, 20) : toH(e.target.value)); };
$('live').onclick = () => L.live(); $('play').onclick = () => L.play();
$('online').onclick = () => { const on = !L.device.online; L.setOnline(on); $('online').setAttribute('aria-pressed', on); $('online').textContent = on ? 'Light online' : 'Light offline'; };
$('retry').onclick = () => L.retry();

const rib = $('ribbon'), cv = $('ribbonCv'), ctx = cv.getContext('2d');
function drawRibbon() {
  const w = cv.width = rib.clientWidth * devicePixelRatio, h = cv.height = rib.clientHeight * devicePixelRatio;
  for (let x = 0; x < w; x += 2) {
    const v = L.view(x / w * 24);
    const a = Math.min(1, v.level * 1.7 + 0.06);
    ctx.fillStyle = `rgba(${v.rgb},${a})`;
    const bar = h * (0.12 + 0.88 * Math.min(1, v.level * 1.6));
    ctx.fillRect(x, h - bar, 2, bar);
  }
}
const scrub = (e) => { const r = rib.getBoundingClientRect(); L.setTime(L.clamp((e.clientX - r.left) / r.width, 0, .9999) * 24); };
rib.onpointerdown = (e) => { rib.setPointerCapture(e.pointerId); scrub(e); };
rib.onpointermove = (e) => e.buttons && scrub(e);
rib.onkeydown = (e) => { const d = { ArrowLeft: -0.25, ArrowRight: 0.25 }[e.key]; if (d) { L.setTime(L.clock.t + d); e.preventDefault(); } };
addEventListener('resize', drawRibbon);

L.on((why) => {
  const v = L.view(), s = L.state;
  document.documentElement.style.setProperty('--light', v.color);
  document.documentElement.style.setProperty('--lvl', Math.min(1, v.level * 1.6).toFixed(3));
  $('par').textContent = Math.round(v.par);
  $('phase').textContent = v.phase; $('time').textContent = v.time;
  $('mode').textContent = { live: 'live', scrub: 'preview', play: 'playing' }[L.clock.mode];
  $('head').style.left = (v.t / 24 * 100) + '%'; $('headLbl').textContent = v.time;
  rib.setAttribute('aria-valuenow', v.t.toFixed(2)); rib.setAttribute('aria-valuetext', v.time + ' ' + v.phase);
  $('live').setAttribute('aria-pressed', L.clock.mode === 'live'); $('play').setAttribute('aria-pressed', L.clock.mode === 'play');
  if (why === 'time') return;
  if (why !== 'sync') drawRibbon();
  L.CHANNELS.forEach(c => { const el = $('c-' + c.id); if (document.activeElement !== el) el.value = s.mix[c.id]; el.style.setProperty('--p', s.mix[c.id] + '%'); $('o-' + c.id).textContent = s.mix[c.id] + '%'; });
  $('m').value = s.master; $('m').style.setProperty('--p', s.master + '%'); $('mo').textContent = s.master + '%';
  document.querySelectorAll('[data-p]').forEach(b => b.setAttribute('aria-pressed', b.dataset.p === s.preset));
  $('presetName').textContent = (L.PRESETS.find(p => p.id === s.preset) || { name: 'Custom mix' }).name;
  document.querySelectorAll('#sched input').forEach(i => { if (document.activeElement !== i) i.value = i.dataset.k === 'moon' ? s.schedule.moon : L.fmt(s.schedule[i.dataset.k]); });
  $('dot').className = 'dot ' + L.sync; $('sync').textContent = { connecting: 'Connecting…', saving: 'Saving to light…', saved: 'Synced', error: 'Not synced' }[L.sync];
  $('err').classList.toggle('show', L.sync === 'error');
  $('log').innerHTML = L.device.log.slice(0, 8).map(e => `<div class="${e.status >= 400 ? 'bad' : ''}"><b>${e.method}</b> ${e.path} · ${e.status} · ${e.ms} ms</div>`).join('') || 'No requests yet';
});
</script>
</body>
</html>
